databases:
  - name: saferecover-postgres
    plan: free
    databaseName: saferecover
    user: saferecover

services:
  - type: web
    name: saferecover-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saferecover-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: CORS_ORIGINS
        sync: false
      - key: N8N_RETRY_WEBHOOK_URL
        sync: false

  - type: web
    name: saferecover-n8n
    runtime: image
    plan: free
    image:
      url: docker.io/n8nio/n8n:latest
    healthCheckPath: /healthz
    envVars:
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: saferecover-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: saferecover-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: saferecover-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: saferecover-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: saferecover-postgres
          property: password
      - key: DB_POSTGRESDB_SCHEMA
        value: n8n
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_HOST
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: SAFERECOVER_API_URL
        sync: false
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"

  - type: web
    name: saferecover-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
