databases:
  - name: saferecover-postgres
    plan: free
    databaseName: saferecover
    user: saferecover

services:
  - type: web
    name: saferecover-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: saferecover-postgres
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CORS_ORIGINS
        value: https://saferecover-dashboard.onrender.com
      - key: N8N_RETRY_WEBHOOK_URL
        value: https://saferecover-n8n.onrender.com/webhook/saferecover-retry

  - type: web
    name: saferecover-n8n
    runtime: image
    plan: free
    image:
      url: docker.io/n8nio/n8n:latest
    healthCheckPath: /healthz
    envVars:
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: saferecover-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: saferecover-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: saferecover-postgres
          property: database
      - key: DB_POSTGRESDB Dee? Need clean. Continue.
        property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: saferecover-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: saferecover-postgres
          property: password
      - key: DB_POSTGRESDB_SCHEMA
        value: public
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_HOST
        value: saferecover-n8n.onrender.com
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_WEBHOOK_URL
        value: https://saferecover-n8n.onrender.com/
      - key: N8N_EDITOR_BASE_URL
        value: https://saferecover-n8n.onrender.com/
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: SAFERECOVER_API_URL
        value: https://saferecover-api.onrender.com
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: N8N_RUNNERS_ENABLED
        value: "false"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"

  - type: web
    name: saferecover-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://saferecover-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html